name: Sync Azure Cloud IPs

on:
  schedule:
    - cron: '0 12 * * 4'   # Todos los jueves a las 12:00 UTC
  workflow_dispatch:        # Permite ejecutarlo manualmente también

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar lista de IPs
        run: python scripts/generate_azure_ips.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add azure-cloud-ips.txt
          git diff --staged --quiet || git commit -m "Auto-update: Azure Cloud IPs $(date -u +%Y-%m-%d)"
          git push
